<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#d2e5d1" stop-opacity="0.75"/><stop offset="0.69" stop-color="#f7f8f3" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#243328" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="630" fill="#f7f8f3"/>
  <circle cx="1080" cy="80" r="420" fill="url(#glow)"/>

  <!-- brand -->
  <g transform="translate(80 54)">
    <rect width="44" height="44" rx="12" fill="#17211b"/>
    <g transform="scale(1.1)">
      <rect x="8.5" y="12" width="23" height="5" rx="2.5" fill="#f7f8f3"/>
      <rect x="8.5" y="23" width="14" height="5" rx="2.5" fill="#ed7c2c"/>
      <path d="M27 21v4.5" stroke="#f7f8f3" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>
    </g>
  </g>
  <text x="138" y="87" font-size="31" font-weight="800" fill="#17211b" letter-spacing="-1.2">side<tspan fill="#ed7c2c">·</tspan>str</text>
  <rect x="290" y="62" width="112" height="28" rx="7" fill="none" stroke="#dde3da" stroke-width="1.5"/>
  <text x="346" y="81" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#5d685f">draft 0.0.5</text>

  <!-- eyebrow -->
  <rect x="80" y="140" width="310" height="34" rx="17" fill="#ffffff" fill-opacity="0.7" stroke="#dbe3d7" stroke-width="1.5"/>
  <circle cx="99" cy="157" r="11" fill="#fff0e3"/>
  <path d="M99 150.5l1.4 3.7 3.7 1.4-3.7 1.4-1.4 3.7-1.4-3.7-3.7-1.4 3.7-1.4z" fill="#b95216"/>
  <text x="118" y="162" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#4f5d51" letter-spacing="0.3"><tspan fill="#b95216" font-weight="700">U</tspan>SER <tspan fill="#b95216" font-weight="700">A</tspan>CTIVATED <tspan fill="#b95216" font-weight="700">S</tspan>IDECHAINS</text>

  <!-- headline -->
  <text x="76" y="262" font-size="68" font-weight="700" fill="#17211b" letter-spacing="-3.6">Signers order blocks.</text>
  <text x="76" y="338" font-size="68" font-weight="700" fill="#17211b" letter-spacing="-3.6">Users enforce the <tspan fill="#c2590f">rules.</tspan></text>
  <path d="M636 356C690 350 750 350.5 794 353" fill="none" stroke="#ed7c2c" stroke-width="4" stroke-linecap="round" opacity=".65"/>

  <text x="80" y="410" font-size="22" fill="#5d685f">Bitcoin's rules beside a Bitcoin chain. Blocks valid because signed.</text>
  <text x="80" y="441" font-size="22" fill="#5d685f">No subsidy. Every coin locked on the parent, refundable.</text>

  <!-- stats -->
  <line x1="80" y1="492" x2="1120" y2="492" stroke="#dde3da" stroke-width="1.5"/>
  <g>
    <text x="80" y="556" font-size="50" font-weight="700" fill="#2f7a45" letter-spacing="-2">0</text>
    <text x="80" y="584" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#667066" letter-spacing="1.5">SUBSIDY</text>
    <text x="230" y="556" font-size="50" font-weight="700" fill="#17211b" letter-spacing="-2">1</text>
    <text x="230" y="584" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#667066" letter-spacing="1.5">RULE ADDED</text>
    <text x="420" y="556" font-size="50" font-weight="700" fill="#17211b" letter-spacing="-2">0</text>
    <text x="420" y="584" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#667066" letter-spacing="1.5">NATIVE TOKENS</text>
    <text x="1120" y="550" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="700" fill="#b95216">sidestr.com</text>
    <text x="1120" y="580" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#667066" letter-spacing="1.5">VALIDATED IN A TAB</text>
  </g>

  <!-- card -->
  <rect x="872" y="150" width="268" height="300" rx="26" fill="#dfe9dc" transform="rotate(4 1006 300)"/>
  <g filter="url(#soft)"><rect x="840" y="122" width="280" height="320" rx="22" fill="#fffdf8" stroke="#cfd7cb" stroke-width="1.5"/></g>
  <text x="866" y="160" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#566156" letter-spacing="1.5">A SIDING</text>
  <circle cx="1068" cy="156" r="4" fill="#ed7c2c"/><circle cx="1082" cy="156" r="4" fill="#cfd8cb"/><circle cx="1096" cy="156" r="4" fill="#cfd8cb"/>
  <line x1="840" y1="178" x2="1120" y2="178" stroke="#e6ebe2" stroke-width="1.5"/>
  <g font-size="18" fill="#17211b">
    <text x="900" y="217">A document and a key</text><text x="900" y="255">Genesis from the pegs</text><text x="900" y="293">Signed, not mined</text><text x="900" y="331">Rules you adopt</text><text x="900" y="369">Refund without asking</text><text x="900" y="407">Sidings of sidings</text>
  </g>
  <g fill="none" stroke="#ed7c2c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M868 211l5 5 9-10"/><path d="M868 249l5 5 9-10"/><path d="M868 287l5 5 9-10"/><path d="M868 325l5 5 9-10"/><path d="M868 363l5 5 9-10"/><path d="M868 401l5 5 9-10"/>
  </g>
</svg>
